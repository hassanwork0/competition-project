<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../styles/main_style.css" />
    <link rel="stylesheet" href="../styles/topbar_style.css" />
    <link rel="stylesheet" href="../styles/news_style.css" />
    <link rel="stylesheet" href="../styles/footer_style.css" />
    <script src="../scripts/top_bar.js"></script>
    <script src="../scripts/footer.js"></script>
    <script src="../scripts/api/news.js"></script>
    <script src="../scripts/news.js"></script>

    <title>News & Events - Artemis II</title>
  </head>
  <body>
    <header class="top_bar" id="topbar"></header>

    <main>
      <div class="welcome_news">
        <div class="big_card">
          <img src="../assets/orion.jpg" alt="news_img" class="news_img" />
          <p class="news_date">30th Jan , 2026</p>
          <h3 class="news_title">Test Title</h3>
          <p class="news_desc">Test Description short</p>
          <p class="view_more">View More</p>
        </div>

        <div class="small_cards">
          <div class="small_card">
            <img
              src="../assets/crew_photos/Jeremy Hansen.webp"
              alt="news_img"
              class="news_img"
            />
            <p class="news_date">30th Jan , 2026</p>
            <h3 class="news_title">Test Title</h3>
            <p class="news_desc">Test Description short</p>
            <p class="view_more">View More</p>
          </div>
          <div class="small_card">
            <img
              src="../assets/crew_photos/Jeremy Hansen.webp"
              alt="news_img"
              class="news_img"
            />
            <p class="news_date">30th Jan , 2026</p>
            <h3 class="news_title">Test Title</h3>
            <p class="news_desc">Test Description short</p>
            <p class="view_more">View More</p>
          </div>
        </div>
      </div>
    </main>

    <section class="news_section">
      <div class="section_title">
        <h2>Latest News</h2>
        <div class="seprator"></div>
      </div>
      <div class="news_list" id="news"></div>
    </section>

    <footer class="footer" id="footer"></footer>
  </body>
</html>
